# SOPS configuration for archway secrets
# https://github.com/getsops/sops
#
# To set up:
#   1. Generate a key:  age-keygen -o ~/.config/sops/age/keys.txt
#   2. Replace the recipient below with YOUR public key (age1...)
#   3. Encrypt files:   sops --encrypt --in-place secrets/opencode.env
#                        sops --encrypt --in-place secrets/vdirsyncer.secrets
#
# To edit secrets later:  sops secrets/opencode.env
# To decrypt to stdout:   sops --decrypt secrets/opencode.env

creation_rules:
  - path_regex: secrets/.*
    age: >-
      age1XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
