# ~/.config/environment.d/50-archway.conf
# Common environment variables for graphical user sessions managed by archway.
#
# These apply across supported Wayland sessions (Plasma, niri+DMS, etc.).
#
# Graphics platform selection is intentionally NOT set here:
#   - QT_QPA_PLATFORM, SDL_VIDEODRIVER, QT_WAYLAND_* etc. live in the
#     niri environment block (dots/niri/config.kdl) so that the KDE Plasma
#     Wayland session remains independent after a full DMS install.
#   - DMS may append/override settings in ~/.config/environment.d/90-dms.conf
#     (higher lexical priority = loaded later).
#
# Loaded by systemd user session for graphical logins.
#
# See: https://wiki.archlinux.org/title/Environment_variables

# =============================================================================
# EDITOR
# =============================================================================
EDITOR=nvim
VISUAL=nvim

# =============================================================================
# WAYLAND PREFERENCE (safe to set globally)
# =============================================================================
# Many apps (Firefox, Electron) prefer Wayland when a compositor is available
# and remain harmless outside niri.
MOZ_ENABLE_WAYLAND=1

# =============================================================================
# XDG BASE DIRECTORIES
# =============================================================================
# Explicitly set XDG dirs (most apps default to these, but some don't)
XDG_CONFIG_HOME=$HOME/.config
XDG_DATA_HOME=$HOME/.local/share
XDG_STATE_HOME=$HOME/.local/state
XDG_CACHE_HOME=$HOME/.cache

# =============================================================================
# SSH AGENT (Bitwarden)
# =============================================================================
# The Bitwarden desktop app provides an SSH agent at this socket
# Enable in: Bitwarden Desktop > Settings > SSH Agent
SSH_AUTH_SOCK=$HOME/.bitwarden-ssh-agent.sock
