# Fuzzel configuration - dark theme matching DMS purple palette
# Colors sourced from dankcolors (base16 theme used across the system)

[main]
font=CaskaydiaMono NF:size=13
prompt=> 
match-mode=fuzzy
icons-enabled=no
use-bold=yes
lines=12
width=60
anchor=center

[colors]
# Dark background from dankcolors base00
background=141218ee
# Light foreground from dankcolors base05
text=faf8ffff
# Dim text for message
message=9d99a5ff
# Purple accent for prompt
prompt=d7c6ffff
# Dim placeholder
placeholder=9d99a5ff
# Light input text
input=faf8ffff
# Green highlight for matched characters
match=a5ffb8ff
# Purple tinted selection background
selection=d7c6ff30
# Light text for selected entry
selection-text=faf8ffff
# Green match highlight in selection
selection-match=a5ffb8ff
# Dim counter
counter=9d99a5ff
# Purple border
border=d7c6ffcc

[border]
width=2
radius=12
