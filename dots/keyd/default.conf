# keyd configuration: swap CapsLock and Escape
# Deployed to /etc/keyd/default.conf by bootstrap.sh
#
# This config targets ALL keyboards by default. To exclude your external
# split keyboard (so the swap only applies to the laptop's built-in keyboard),
# add its device id as an exclusion below.
#
# To find device ids:
#   sudo keyd monitor
# Then press a key on the device you want to exclude and note the id
# (e.g. 1a2c:4094). Add it as a -<id> line under [ids].
#
# Example with exclusion:
#   [ids]
#   *
#   -1a2c:4094

[ids]
*
[main]
capslock = escape
escape = capslock
