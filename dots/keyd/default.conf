# keyd configuration: CapsLock → Escape (Escape stays Escape)
# Deployed to /etc/keyd/default.conf by bootstrap.sh
#
# Both CapsLock and Escape produce Escape. To toggle CapsLock when
# needed, press Left Shift + Right Shift (hold both, then release).

[ids]
*

[main]
capslock = escape
rightshift = layer(rightshift_layer)

[rightshift_layer:S]
leftshift = capslock
