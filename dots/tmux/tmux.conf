set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
set -g mouse on
set -g set-clipboard on

# Refresh these env vars from the outer shell when reattaching.
# Keeps SSH agent forwarding working across reconnects.
set -g update-environment "SSH_AUTH_SOCK SSH_CONNECTION DISPLAY"

# Performance / correctness
set -g escape-time 0        # no delay after Escape (critical for neovim)
set -g focus-events on      # let neovim receive focus/blur events
set -g allow-passthrough on # enable kitty graphics / image.nvim
set -g history-limit 50000  # default is only 2000
setw -g aggressive-resize on  # use largest client size, not smallest
set -g detach-on-destroy off  # switch to next session instead of exiting tmux

# =============================================================================
# PREFIX
# =============================================================================
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# =============================================================================
# KEYBINDINGS
# =============================================================================

# Reload config
bind e source-file $HOME/.config/tmux/tmux.conf

# Splits (open in current path)
unbind %
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# New window in current path (tmux default opens at $HOME)
bind c new-window -c "#{pane_current_path}"

# Rename window / session
bind r command-prompt -I "#W" "rename-window -- '%%'"
bind R command-prompt -I "#S" "rename-session -- '%%'"

# Kill pane / window / session
bind x kill-pane
bind X kill-window
bind K kill-session

# Vim-like pane selection (prefix+hjkl)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Alt+hjkl to switch panes without prefix
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Alt+number to jump to window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Alt+Left/Right to cycle windows; Alt+Shift+Left/Right to reorder
bind -n M-Left  select-window -t -1
bind -n M-Right select-window -t +1
bind -n M-S-Left  swap-window -t -1 \; select-window -t -1
bind -n M-S-Right swap-window -t +1 \; select-window -t +1

# prefix+P/N to switch sessions; Alt+Up/Down without prefix
bind P switch-client -p
bind N switch-client -n
bind -n M-Up   switch-client -p
bind -n M-Down switch-client -n

# Vim-like copy/paste
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane

# =============================================================================
# WINDOWS
# =============================================================================

# Change from 0 based to 1 based because keyboard layout
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Auto-rename windows to the current directory basename
set -gw automatic-rename on
set -gw automatic-rename-format '#{b:pane_current_path}'

# =============================================================================
# TOOLS
# =============================================================================

# Sessionizer: prefix+f opens fzf project picker in a new window
bind f run-shell "tmux neww ~/bin/tmux-sessionizer"

# Lazygit: prefix+g opens lazygit in a floating popup (dismiss with q)
bind g display-popup -d '#{pane_current_path}' -xC -yC -w90% -h90% -E lazygit

# =============================================================================
# THEME - Tokyonight Moon
# =============================================================================

thm_bg="#222436"
thm_fg="#c8d3f5"
thm_cyan="#86e1fc"
thm_black="#1b1d2b"
thm_gray="#3a3f5a"
thm_magenta="#c099ff"
thm_pink="#ff757f"
thm_red="#ff757f"
thm_green="#c3e88d"
thm_yellow="#ffc777"
thm_blue="#82aaff"
thm_orange="#ff9e64"
thm_black4="#444a73"

# Status bar
set -g status "on"
set -g status-bg "${thm_bg}"
set -g status-justify "left"
set -g status-left-length "100"
set -g status-right-length "100"

# Messages
set -g message-style "fg=${thm_cyan},bg=${thm_gray},align=centre"
set -g message-command-style "fg=${thm_cyan},bg=${thm_gray},align=centre"

# Panes
set -g pane-border-style "fg=${thm_gray}"
set -g pane-active-border-style "fg=${thm_blue}"

# Windows
set -g window-status-activity-style "fg=${thm_fg},bg=${thm_bg},none"
set -g window-status-separator ""
set -g window-status-style "fg=${thm_fg},bg=${thm_bg},none"

# Statusline - current window
set -g window-status-current-format "#[fg=${thm_blue},bg=${thm_bg}] #I: #[fg=${thm_magenta},bg=${thm_bg}](✓) #[fg=${thm_cyan},bg=${thm_bg}]#(echo '#{pane_current_path}' | rev | cut -d'/' -f-2 | rev) #[fg=${thm_magenta},bg=${thm_bg}]"

# Statusline - other windows
set -g window-status-format "#[fg=${thm_blue},bg=${thm_bg}] #I: #[fg=${thm_fg},bg=${thm_bg}]#W"

# Statusline - right side
set -g status-right "#[fg=${thm_blue},bg=${thm_bg},nobold,nounderscore,noitalics]#[fg=${thm_bg},bg=${thm_blue},nobold,nounderscore,noitalics] #[fg=${thm_fg},bg=${thm_gray}] #W #{?client_prefix,#[fg=${thm_magenta}],#[fg=${thm_cyan}]}#[bg=${thm_gray}]#{?client_prefix,#[bg=${thm_magenta}],#[bg=${thm_cyan}]}#[fg=${thm_bg}] #[fg=${thm_fg},bg=${thm_gray}] #S "

# Statusline - left side (empty)
set -g status-left ""

# Modes
set -g clock-mode-colour "${thm_blue}"
set -g mode-style "fg=${thm_blue} bg=${thm_black4} bold"
